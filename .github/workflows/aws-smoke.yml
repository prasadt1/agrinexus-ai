# Optional: golden KB tests against AWS (manual trigger only).
# Add repo secrets: KNOWLEDGE_BASE_ID, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# (prefer OIDC + IAM role for production; see AWS docs for configure-aws-credentials).

name: AWS smoke

on:
  workflow_dispatch:

jobs:
  golden-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: pip install boto3 pytest

      - name: Golden KB tests
        env:
          KNOWLEDGE_BASE_ID: ${{ secrets.KNOWLEDGE_BASE_ID }}
        run: python3 -m pytest tests/test_golden_questions.py -v --maxfail=3
