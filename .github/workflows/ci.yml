name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      # Lambda layout: handlers import their siblings and the common layer as top-level modules.
      PYTHONPATH: src/processor:src/common-layer/python:src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest boto3 requests pyyaml pillow

      - name: Full test suite (live Bedrock tests skip without KNOWLEDGE_BASE_ID)
        run: python3 -m pytest tests/ -q -rf

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --lint
