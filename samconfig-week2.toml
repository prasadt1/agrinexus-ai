version = 0.1

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "agrinexus-week2"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-skxuyk7b5ott"
s3_prefix = "agrinexus-week2"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
# After rebuilding KB on S3 Vectors, set KnowledgeBaseId to the new ID from Bedrock.
# OpenWeatherMap key: store in Secrets Manager (agrinexus/weather/api-key); see WEATHER-API-SETUP.md.
parameter_overrides = [
    "Environment=dev",
    "TableName=agrinexus-data",
    "TableStreamArn=arn:aws:dynamodb:us-east-1:043624892076:table/agrinexus-data/stream/2026-02-16T07:55:35.380",
    "KnowledgeBaseId=ARZ4XQEBCU",
    # Guardrail disabled: Bedrock Guardrails add per-request cost at scale; re-enable with GuardrailId=\"YOUR_ID\" when budget allows.
    "GuardrailId=\"\"",
    "GuardrailVersion=1",
    # Optional: comma-separated digits (no +) exempt from webhook MSG rate limit for pilot demos. Leave empty in public clones.
    "RateLimitBypassPhones=\"\"",
    "RateLimitDisabled=false"
]

[default.build]
[default.build.parameters]
cached = true
parallel = true
