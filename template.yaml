AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AgriNexus AI - Week 2 (WhatsApp Integration + Behavioral Nudge Engine)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name
  
  TableName:
    Type: String
    Default: agrinexus-data
    Description: DynamoDB table name from Week 1
  
  TableStreamArn:
    Type: String
    Description: DynamoDB Stream ARN from Week 1 (required for Response Detector)
  
  KnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID from Week 1
  
  GuardrailId:
    Type: String
    Default: ""
    Description: >-
      Optional external Bedrock Guardrail ID. When empty, the stack uses the
      AgriNexusContentGuardrail resource created below.

  GuardrailVersion:
    Type: String
    Default: "DRAFT"
    Description: >-
      Guardrail version when GuardrailId is set externally. Ignored when the
      stack-managed AgriNexusContentGuardrail is used.

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    AllowedPattern: '^[a-z]+\.[a-z0-9-]+\.[A-Za-z0-9:_-]+$'
    ConstraintDescription: A cross-region inference profile ID such as us.anthropic.<model>; IAM derives the foundation-model ARN from it.
    Description: >-
      Bedrock inference profile ID for RAG (RetrieveAndGenerate) and vision
      (InvokeModel). Use an active profile from list-inference-profiles.

  RelevanceModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: '^[a-z]+\.[a-z0-9-]+\.[A-Za-z0-9:_-]+$'
    ConstraintDescription: A cross-region inference profile ID such as us.anthropic.<model>; IAM derives the foundation-model ARN from it.
    Description: >-
      Bedrock inference profile ID for the cheap photo relevance check that
      runs before vision diagnosis.

  NudgeSendWindowStartHour:
    Type: Number
    Default: 6
    MinValue: 0
    MaxValue: 23
    Description: First Asia/Kolkata hour (inclusive) in which weather nudges may be sent.

  NudgeSendWindowEndHour:
    Type: Number
    Default: 19
    MinValue: 1
    MaxValue: 24
    Description: Asia/Kolkata hour (exclusive) at which the nudge send window closes. Must be greater than the start hour.

  VisitorTtlDays:
    Type: Number
    Default: 7
    Description: DynamoDB TTL days for re:Invent visitor profiles and conversation rows.

  VisitorDailyGlobalCap:
    Type: Number
    Default: 300
    Description: Max Bedrock-backed visitor answers per UTC day (all visitors combined).

  VisitorDailyPerUserCap:
    Type: Number
    Default: 10
    Description: Max Bedrock-backed answers per visitor number per UTC day.

  VisitorSampleImageCrop:
    Type: String
    Default: Cotton
    AllowedValues:
      - Cotton
      - Wheat
      - Soybean
      - Maize
    Description: >-
      Confirmed crop for the re:Invent visitor sample photo (VISITOR_SAMPLE_IMAGE_KEY).
      Not inferred by the model; used on the same path as farmer crop-confirm.

  RateLimitBypassPhones:
    Type: String
    Default: ""
    Description: >-
      Comma-separated WhatsApp numbers (digits only, no +) exempt from webhook MSG rate limit.
      Use for demo/pilot; leave empty for normal operation.

  RateLimitDisabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: If true, disables per-user WhatsApp message rate limiting (demo only).

  BetaPhones:
    Type: String
    Default: ""
    Description: >-
      Comma-separated WhatsApp numbers (digits only, no +) routed to the beta vision pipeline.
      Leave empty to disable beta routing.

Conditions:
  UseExternalGuardrail: !Not [!Equals [!Ref GuardrailId, ""]]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Tracing: Active  # Enable AWS X-Ray distributed tracing
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
        GUARDRAIL_ID: !If
          - UseExternalGuardrail
          - !Ref GuardrailId
          - !GetAtt AgriNexusContentGuardrail.GuardrailId
        GUARDRAIL_VERSION: !If
          - UseExternalGuardrail
          - !Ref GuardrailVersion
          - !GetAtt AgriNexusContentGuardrailVersion.Version
        RATE_LIMIT_MESSAGES: "25"  # Max inbound WhatsApp messages per user per hour (see webhook FilterExpression)
        RATE_LIMIT_WINDOW_SECONDS: "3600"  # 1 hour window
        VISITOR_TTL_DAYS: !Ref VisitorTtlDays
        VISITOR_DAILY_GLOBAL_CAP: !Ref VisitorDailyGlobalCap
        VISITOR_DAILY_PER_USER_CAP: !Ref VisitorDailyPerUserCap

Resources:
  # ============================================================================
  # Bedrock Guardrail (content filters + prompt attack + non-farming redirect)
  # ============================================================================
  AgriNexusContentGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub agrinexus-content-${Environment}
      Description: AgriNexus farming-topic guardrail (WhatsApp + web chat)
      BlockedInputMessaging: >-
        I can only help with farming questions — crops, pests, weather, soil, or irrigation.
        Please ask something related to agriculture.
      BlockedOutputsMessaging: >-
        I can only help with farming questions — crops, pests, weather, soil, or irrigation.
        Please ask something related to agriculture.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: NonFarmingTopics
            Definition: >-
              Non-agricultural questions about politics, sports scores, entertainment,
              celebrity gossip, general software coding, or stock prices unrelated to farming.
            Examples:
              - Who won the football match yesterday?
              - Write a React todo app for me
              - What is Amazon stock price today?
              - Tell me a celebrity joke
              - Who is winning the cricket match?
            Type: DENY

  # Pin a numbered version so console DRAFT edits cannot change live Lambda behavior
  # without a stack update that recreates this version resource.
  AgriNexusContentGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt AgriNexusContentGuardrail.GuardrailId
      Description: !Sub Pinned content guardrail for ${Environment}

  # ============================================================================
  # Lambda Layer: Common Utilities
  # ============================================================================
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub agrinexus-common-${Environment}
      Description: Common utilities for WhatsApp integration (caching, PII redaction, district helplines)
      ContentUri: src/common-layer/
      CompatibleRuntimes:
        - python3.13

  # ============================================================================
  # Note: WhatsApp secrets are already created in Secrets Manager:
  # - agrinexus/whatsapp/verify-token
  # - agrinexus/whatsapp/access-token
  # - agrinexus/whatsapp/phone-number-id
  # No need to create them here
  # ============================================================================

  # ============================================================================
  # SQS Queue for Async Message Processing
  # ============================================================================
  MessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-messages-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling - reduces SQS API calls
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MessageDLQ.Arn
        maxReceiveCount: 3

  MessageDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-messages-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling - reduces SQS API calls

  # ============================================================================
  # SQS Queue for Beta Message Processing (your phone only)
  # ============================================================================
  BetaMessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-messages-beta-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BetaMessageDLQ.Arn
        maxReceiveCount: 3

  BetaMessageDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-messages-beta-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      ReceiveMessageWaitTimeSeconds: 20

  # ============================================================================
  # SQS Queue for Voice Processing
  # ============================================================================
  VoiceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-voice-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling - reduces SQS API calls
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VoiceDLQ.Arn
        maxReceiveCount: 3

  VoiceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-voice-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      ReceiveMessageWaitTimeSeconds: 20

  # ============================================================================
  # S3 Bucket for Temporary Audio Storage
  # ============================================================================
  TempAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub agrinexus-temp-audio-${Environment}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldAudio
            Status: Enabled
            Prefix: voice/
            ExpirationInDays: 1  # Delete voice files after 1 day
          - Id: DeleteOldVoiceReplies
            Status: Enabled
            Prefix: voice-output/
            ExpirationInDays: 1  # Polly replies; presigned URL lasts 1 hour
          - Id: DeleteOldImages
            Status: Enabled
            Prefix: images/
            ExpirationInDays: 7  # Delete analyzed images after 7 days
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================================
  # API Gateway for WhatsApp Webhook
  # ============================================================================
  WhatsAppApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub agrinexus-whatsapp-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # ============================================================================
  # API Gateway for Web Chat Demo
  # ============================================================================
  WebChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub agrinexus-web-chat-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          # Demo-safe throttling: reduces burst/bot risk at the edge
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  # ============================================================================
  # WAFv2: Protect public Web Chat API from abuse
  # ============================================================================
  WebChatWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub agrinexus-web-chat-waf-${Environment}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub agrinexusWebChatWaf-${Environment}
      Rules:
        - Name: RateLimitChat
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub agrinexusWebChatRateLimit-${Environment}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              # WAF rate limits are evaluated over a fixed 5-minute window.
              # This is a backstop; app-layer hourly caps still apply.
              Limit: 300
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: "/chat"
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
                  PositionalConstraint: ENDS_WITH

  WebChatWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${WebChatApi}/stages/${Environment}
      WebACLArn: !GetAtt WebChatWebAcl.Arn

  # ============================================================================
  # Lambda: WhatsApp Webhook Handler
  # ============================================================================
  WebhookHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-webhook-${Environment}
      CodeUri: src/webhook/
      Handler: handler.lambda_handler
      Description: WhatsApp webhook handler with signature validation
      MemorySize: 256  # Reduced from 512MB - only does validation + SQS enqueue
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          QUEUE_URL: !Ref MessageQueue
          QUEUE_URL_BETA: !Ref BetaMessageQueue
          VOICE_QUEUE_URL: !Ref VoiceQueue
          BETA_PHONES: !Ref BetaPhones
          VERIFY_TOKEN_SECRET: agrinexus/whatsapp/verify-token
          APP_SECRET_NAME: agrinexus/whatsapp/app-secret
          VERIFY_SIGNATURE: "true"
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
          RATE_LIMIT_BYPASS_PHONES: !Ref RateLimitBypassPhones
          RATE_LIMIT_DISABLED: !Ref RateLimitDisabled
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MessageQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BetaMessageQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VoiceQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*
      Events:
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref WhatsAppApi
            Path: /webhook
            Method: GET
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref WhatsAppApi
            Path: /webhook
            Method: POST

  # ============================================================================
  # Lambda: Web Chat Handler (Public Demo)
  # ============================================================================
  WebChatHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-web-chat-${Environment}
      CodeUri: src/web-chat/
      Handler: handler.lambda_handler
      Description: Public web chat API for text queries (no phone number required)
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          WEB_RATE_LIMIT: "5"  # 5 queries per hour per IP
          WEB_RATE_LIMIT_WINDOW: "3600"  # 1 hour
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ACCOUNT_ID: !Ref AWS::AccountId
          WEB_IMAGE_MAX_BYTES: "5242880"
          WEB_MAX_IMAGES: "1"
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                # A cross-region profile invokes the model in each of its regions.
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Provider}.${Model}
                  - Provider: !Select [1, !Split [".", !Ref BedrockModelId]]
                    Model: !Select [2, !Split [".", !Ref BedrockModelId]]
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !Sub
                - arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${Gid}
                - Gid: !If [UseExternalGuardrail, !Ref GuardrailId, !GetAtt AgriNexusContentGuardrail.GuardrailId]
            - Effect: Allow
              Action:
                - bedrock:RetrieveAndGenerate  # supports no resource-level permissions
              Resource: '*'
      Events:
        WebChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebChatApi
            Path: /chat
            Method: POST
        WebChatOptions:
          Type: Api
          Properties:
            RestApiId: !Ref WebChatApi
            Path: /chat
            Method: OPTIONS

  # ============================================================================
  # Lambda: Health Check (Judge-friendly liveness endpoint)
  # ============================================================================
  HealthHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-health-${Environment}
      CodeUri: src/health/
      Handler: handler.lambda_handler
      Description: Simple liveness endpoint for API verification
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          APP_VERSION: "1.0.0"
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebChatApi
            Path: /health
            Method: GET

  # ============================================================================
  # Lambda: Message Processor
  # ============================================================================
  MessageProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-processor-${Environment}
      CodeUri: src/processor/
      Handler: handler.lambda_handler
      Description: Process messages from SQS and interact with Bedrock
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          QUEUE_URL: !Ref MessageQueue
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
          TEMP_AUDIO_BUCKET: !Ref TempAudioBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ACCOUNT_ID: !Ref AWS::AccountId
          APPEND_DISTRICT_HELPLINE: "true"
          # Shorter Polly audio; full reply always sent as text first (see output.truncate_for_voice)
          VOICE_TTS_MAX_CHARS: "700"
          IMAGE_MAX_BYTES: "5242880"
          VISION_RELEVANCE_MODEL_ID: !Ref RelevanceModelId
          VISITOR_SAMPLE_IMAGE_BUCKET: !Ref TempAudioBucket
          VISITOR_SAMPLE_IMAGE_KEY: visitor-samples/crop-leaf.jpg
          VISITOR_SAMPLE_IMAGE_CROP: !Ref VisitorSampleImageCrop
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - S3CrudPolicy:
            BucketName: !Ref TempAudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                # A cross-region profile invokes the model in each of its regions.
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Provider}.${Model}
                  - Provider: !Select [1, !Split [".", !Ref BedrockModelId]]
                    Model: !Select [2, !Split [".", !Ref BedrockModelId]]
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${RelevanceModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Provider}.${Model}
                  - Provider: !Select [1, !Split [".", !Ref RelevanceModelId]]
                    Model: !Select [2, !Split [".", !Ref RelevanceModelId]]
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !Sub
                - arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${Gid}
                - Gid: !If [UseExternalGuardrail, !Ref GuardrailId, !GetAtt AgriNexusContentGuardrail.GuardrailId]
            - Effect: Allow
              Action:
                - bedrock:RetrieveAndGenerate  # supports no resource-level permissions
              Resource: '*'
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MessageQueue.Arn
            Enabled: true
            BatchSize: 1  # Process one message at a time to maintain strict ordering

  # ============================================================================
  # Lambda: Message Processor (Beta lane)
  # ============================================================================
  BetaMessageProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-processor-beta-${Environment}
      CodeUri: src/processor/
      Handler: handler.lambda_handler
      Description: Beta message processor (isolated from judges)
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          QUEUE_URL: !Ref BetaMessageQueue
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
          TEMP_AUDIO_BUCKET: !Ref TempAudioBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ACCOUNT_ID: !Ref AWS::AccountId
          APPEND_DISTRICT_HELPLINE: "true"
          VOICE_TTS_MAX_CHARS: "700"
          IMAGE_MAX_BYTES: "5242880"
          VISION_QUALITY_GATE_ENABLED: "true"
          VISION_RELEVANCE_MODEL_ID: !Ref RelevanceModelId
          LAST_IMAGE_OVERRIDE_ENABLED: "true"
          LAST_IMAGE_TTL_SECONDS: "600"
          VISION_MIN_DIMENSION: "320"
          VISION_MIN_FILE_BYTES: "3000"
          VISITOR_SAMPLE_IMAGE_BUCKET: !Ref TempAudioBucket
          VISITOR_SAMPLE_IMAGE_KEY: visitor-samples/crop-leaf.jpg
          VISITOR_SAMPLE_IMAGE_CROP: !Ref VisitorSampleImageCrop
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - S3CrudPolicy:
            BucketName: !Ref TempAudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                # A cross-region profile invokes the model in each of its regions.
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Provider}.${Model}
                  - Provider: !Select [1, !Split [".", !Ref BedrockModelId]]
                    Model: !Select [2, !Split [".", !Ref BedrockModelId]]
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${RelevanceModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Provider}.${Model}
                  - Provider: !Select [1, !Split [".", !Ref RelevanceModelId]]
                    Model: !Select [2, !Split [".", !Ref RelevanceModelId]]
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !Sub
                - arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${Gid}
                - Gid: !If [UseExternalGuardrail, !Ref GuardrailId, !GetAtt AgriNexusContentGuardrail.GuardrailId]
            - Effect: Allow
              Action:
                - bedrock:RetrieveAndGenerate  # supports no resource-level permissions
              Resource: '*'
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BetaMessageQueue.Arn
            Enabled: true
            BatchSize: 1

  # ============================================================================
  # Lambda: Voice Processor (Amazon Transcribe)
  # ============================================================================
  VoiceProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-voice-${Environment}
      CodeUri: src/voice/
      Handler: processor.lambda_handler
      Description: Process WhatsApp voice notes using Amazon Transcribe
      Timeout: 120
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          TEMP_AUDIO_BUCKET: !Ref TempAudioBucket
          QUEUE_URL: !Ref MessageQueue
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
          VOICE_INPUT_MAX_BYTES: "5242880"
          TRANSCRIBE_MAX_POLL_SEC: "105"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - S3CrudPolicy:
            BucketName: !Ref TempAudioBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MessageQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*
      Events:
        VoiceQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VoiceQueue.Arn
            Enabled: true
            BatchSize: 1  # Process one voice note at a time

  # ============================================================================
  # Lambda: DLQ Handler (Dialect-Aware Error Messages)
  # ============================================================================
  DLQHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-dlq-${Environment}
      CodeUri: src/dlq/
      Handler: handler.lambda_handler
      Description: Handle failed messages with dialect-aware error responses
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*
      Events:
        DLQEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MessageDLQ.Arn
            Enabled: true
            BatchSize: 10
        VoiceDLQEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VoiceDLQ.Arn
            Enabled: true
            BatchSize: 10

  # ============================================================================
  # Lambda: Weather Poller
  # ============================================================================
  WeatherPoller:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-weather-${Environment}
      CodeUri: src/weather/
      Handler: handler.lambda_handler
      Description: Poll weather API and trigger nudge workflow
      MemorySize: 256  # Reduced from 512MB - minimal processing, just DynamoDB scan + Step Functions trigger
      Timeout: 60
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref NudgeStateMachine
          MOCK_WEATHER: "false"
          WEATHER_API_KEY_SECRET: agrinexus/weather/api-key
          WEATHER_API_BASE: "https://api.openweathermap.org/data/2.5/weather"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt NudgeStateMachine.Name
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/weather/api-key-*
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Description: Poll weather every 6 hours
            Enabled: true

  # ============================================================================
  # Lambda: Nudge Sender
  # ============================================================================
  NudgeSender:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-nudge-sender-${Environment}
      CodeUri: src/nudge/
      Handler: sender.lambda_handler
      Description: Send behavioral nudges via WhatsApp
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          REMINDER_LAMBDA_ARN: !GetAtt ReminderSender.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
          NUDGE_TEMPLATE_NAME: weather_nudge_spray
          USE_NUDGE_TEMPLATE: "true"
          NUDGE_BEDROCK_LINER: "false"
          NUDGE_LINER_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          NUDGE_WINDOW_START_HOUR: !Ref NudgeSendWindowStartHour
          NUDGE_WINDOW_END_HOUR: !Ref NudgeSendWindowEndHour
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
              Resource:
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/reminder-*
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/expiry-*
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*

  # ============================================================================
  # Lambda: Reminder Sender
  # ============================================================================
  ReminderSender:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-reminder-${Environment}
      CodeUri: src/nudge/
      Handler: reminder.lambda_handler
      Description: Send T+24h and T+48h reminders
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          ACCESS_TOKEN_SECRET: agrinexus/whatsapp/access-token
          PHONE_NUMBER_ID_SECRET: agrinexus/whatsapp/phone-number-id
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
              Resource:
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/reminder-*
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/expiry-*
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus-whatsapp-*

  # ============================================================================
  # Lambda: Response Detector (DynamoDB Streams)
  # ============================================================================
  ResponseDetector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub agrinexus-response-detector-${Environment}
      CodeUri: src/nudge/
      Handler: detector.lambda_handler
      Description: Detect DONE/NOT YET responses and update nudge status
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - CloudWatchPutMetricPolicy: {}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ResponseDetectorFailureQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource:
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/reminder-*
                - !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/expiry-*
            - Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource: !Ref TableStreamArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agrinexus/whatsapp/*'

  # ============================================================================
  # SNS Topic for Alerts
  # ============================================================================
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub agrinexus-alerts-${Environment}
      DisplayName: AgriNexus System Alerts

  # ============================================================================
  # CloudWatch Alarm for Failed State Machine Executions
  # ============================================================================
  NudgeWorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-nudge-workflow-failures-${Environment}
      AlarmDescription: Alert when nudge workflow executions fail
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref NudgeStateMachine
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # ============================================================================
  # Step Functions: Nudge Workflow
  # ============================================================================
  NudgeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub agrinexus-nudge-workflow-${Environment}
      DefinitionUri: statemachine/nudge-workflow.asl.json
      DefinitionSubstitutions:
        NudgeSenderArn: !GetAtt NudgeSender.Arn
        TableName: !Ref TableName
        AlertTopicArn: !Ref AlertTopic
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref NudgeSender
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName

  # ============================================================================
  # IAM Role for EventBridge Scheduler
  # ============================================================================
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AgriNexus-Scheduler-Role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt ReminderSender.Arn

  # ============================================================================
  # DynamoDB Stream Event Source Mapping for Response Detector
  # Note: Requires DynamoDB table from Week 1 to have Streams enabled
  # ============================================================================
  ResponseDetectorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref TableStreamArn
      FunctionName: !GetAtt ResponseDetector.Arn
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 10
      MaximumRetryAttempts: 2
      MaximumRecordAgeInSeconds: 3600
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ResponseDetectorFailureQueue.Arn

  # Stream batches that still fail after retries land here (record metadata only).
  ResponseDetectorFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrinexus-response-detector-failures-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days

  # ============================================================================
  # Cost Monitoring: Budget Alert
  # ============================================================================
  CostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-high-cost-${Environment}
      AlarmDescription: Alert when daily estimated charges exceed threshold
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400  # 24 hours
      EvaluationPeriods: 1
      Threshold: 20  # Alert if daily cost >= $20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # --------------------------------------------------------------------------
  # Lambda + SQS alarms (credibility: catch silent failures / stuck queues)
  # See docs/operations/RUNBOOK-ALERTS.md
  # --------------------------------------------------------------------------
  ProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-processor-errors-${Environment}
      AlarmDescription: MessageProcessor Lambda error count
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub agrinexus-processor-${Environment}
      AlarmActions:
        - !Ref AlertTopic

  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-webhook-errors-${Environment}
      AlarmDescription: WebhookHandler Lambda error count
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub agrinexus-webhook-${Environment}
      AlarmActions:
        - !Ref AlertTopic

  WebChatErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-web-chat-errors-${Environment}
      AlarmDescription: WebChatHandler Lambda error count
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub agrinexus-web-chat-${Environment}
      AlarmActions:
        - !Ref AlertTopic

  VoiceProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-voice-errors-${Environment}
      AlarmDescription: VoiceProcessor Lambda error count
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub agrinexus-voice-${Environment}
      AlarmActions:
        - !Ref AlertTopic

  MessageQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-messages-queue-age-${Environment}
      AlarmDescription: Main FIFO queue oldest message age (stuck pipeline)
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MessageQueue.QueueName
      AlarmActions:
        - !Ref AlertTopic

  MessageDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-messages-dlq-depth-${Environment}
      AlarmDescription: Messages landed on processor DLQ (after retries)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MessageDLQ.QueueName
      AlarmActions:
        - !Ref AlertTopic

  # ============================================================================
  # API Gateway 5XX alarm (web chat) — catches handler failures that return 5xx
  # ============================================================================
  WebChatApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-web-chat-api-5xx-${Environment}
      AlarmDescription: Web chat API Gateway 5XXError count
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Sub agrinexus-web-chat-${Environment}
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref AlertTopic

  # ============================================================================
  # Synthetic canary: POST /chat with a fixed prompt; alarm on non-success
  # ============================================================================
  WebChatCanaryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub agrinexus-canary-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 31

  WebChatCanaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AgriNexus-WebChat-Canary-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: synthetics.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebChatCanaryAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt WebChatCanaryBucket.Arn
                  - !Sub ${WebChatCanaryBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt WebChatCanaryBucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                Resource: '*'

  WebChatCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Sub agnx-chat-${Environment}
      ArtifactS3Location: !Sub s3://${WebChatCanaryBucket}/canary
      ExecutionRoleArn: !GetAtt WebChatCanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-9.1
      Schedule:
        Expression: rate(15 minutes)
        DurationInSeconds: 0
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          CHAT_URL: !Sub https://${WebChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/chat
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 2
      FailureRetentionPeriod: 14
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');
          const https = require('https');
          const { URL } = require('url');

          const postChat = async function () {
            const chatUrl = process.env.CHAT_URL;
            if (!chatUrl) {
              throw new Error('CHAT_URL env var is required');
            }
            const payload = JSON.stringify({
              message: 'How to control cotton pests?',
              language: 'en'
            });
            const url = new URL(chatUrl);
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(payload)
              },
              timeout: 45000
            };
            const statusCode = await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => { body += chunk; });
                res.on('end', () => {
                  log.info(`Canary status=${res.statusCode} body=${body.slice(0, 200)}`);
                  resolve(res.statusCode);
                });
              });
              req.on('error', reject);
              req.on('timeout', () => {
                req.destroy();
                reject(new Error('Canary request timed out'));
              });
              req.write(payload);
              req.end();
            });
            if (statusCode !== 200) {
              throw new Error(`Web chat canary expected 200, got ${statusCode}`);
            }
          };

          exports.handler = async () => {
            return await synthetics.executeStep('postChat', postChat);
          };

  WebChatCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub agrinexus-web-chat-canary-${Environment}
      AlarmDescription: Synthetic canary POST /chat SuccessPercent below 100
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Statistic: Average
      Period: 900
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: CanaryName
          Value: !Sub agnx-chat-${Environment}
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  WebhookUrl:
    Description: WhatsApp webhook URL
    Value: !Sub https://${WhatsAppApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhook

  WebChatApiUrl:
    Description: Web chat API endpoint (for public demo)
    Value: !Sub https://${WebChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/chat

  WebChatHealthUrl:
    Description: Health endpoint (liveness check)
    Value: !Sub https://${WebChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/health

  MessageQueueUrl:
    Description: SQS queue URL for message processing
    Value: !Ref MessageQueue

  VoiceQueueUrl:
    Description: SQS queue URL for voice processing
    Value: !Ref VoiceQueue

  TempAudioBucketName:
    Description: S3 bucket for temporary audio storage
    Value: !Ref TempAudioBucket

  NudgeStateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref NudgeStateMachine

  AlertTopicArn:
    Description: SNS topic ARN for system alerts
    Value: !Ref AlertTopic
